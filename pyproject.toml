[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-terminal-app"
version = "0.1.0"
description = "An AI-Native Developer CLI"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
dev = "dev:main"

[tool.setuptools]
py-modules = ["dev", "agent", "ai", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*", "gateway*"]
