[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-terminal-app"
version = "0.1.3"
description = "An AI-Native Developer CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0",
    "ollama>=0.4",
    "openai>=1.0",
    "keyring>=25.0",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "litellm>=1.0",
]

[project.scripts]
dev = "dev:main"

[tool.setuptools]
py-modules = ["dev", "agent", "ai", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["toolbox*", "gateway*"]
exclude = ["tests*", "test*"]
